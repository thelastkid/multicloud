apiVersion: apps/v1
kind: Deployment

metadata:
  name: scheduler
  namespace: mlops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: scheduler

  template:
    metadata:
      labels:
        app: scheduler

    spec:
      containers:
        - name: scheduler
          image: scheduler-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8001